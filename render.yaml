# Render Blueprint for the ValleyMind AI marketing website (static site).
#
# HOW TO APPLY THE HEADERS BELOW:
#   Option A (IaC): create this service from a Blueprint (render.com -> New ->
#     Blueprint -> point at this repo). Render then applies these headers.
#   Option B (existing standalone Static Site): copy the header name/value pairs
#     into  Dashboard -> your Static Site -> Settings -> Headers.
#
# These headers give the site its security posture + caching. They do NOT change
# any page behaviour.

services:
  - type: web
    name: valley-mind-website
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false

    headers:
      # ── Security ─────────────────────────────────────────────
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000"
      # CSP tuned for THIS site: self + Google Fonts + inline styles/scripts
      # (the pages use inline style attrs and inline JSON-LD/SW-registration).
      # Loosen only if you add a new external origin (e.g. an analytics domain).
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: https:; media-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; form-action 'self' mailto:; upgrade-insecure-requests"

      # ── Caching ──────────────────────────────────────────────
      # Long cache for immutable-ish media/icons.
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=2592000"
      # The service worker must revalidate every load so updates ship fast.
      - path: /sw.js
        name: Cache-Control
        value: "no-cache"
      - path: /manifest.json
        name: Cache-Control
        value: "public, max-age=86400"

    # ── Optional: extensionless "clean" URLs (/about -> /about.html) ──
    # Uncomment to enable. If you do, also switch every canonical/OG URL and
    # the sitemap to the extensionless form so there is exactly one URL per page.
    # routes:
    #   - type: rewrite
    #     source: /about
    #     destination: /about.html
    #   - type: rewrite
    #     source: /features
    #     destination: /features.html
    #   - type: rewrite
    #     source: /pricing
    #     destination: /pricing.html
    #   - type: rewrite
    #     source: /faq
    #     destination: /faq.html
    #   - type: rewrite
    #     source: /contact
    #     destination: /contact.html
