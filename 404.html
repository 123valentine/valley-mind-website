<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — ValleyMind AI</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0d0d1a">
  <link rel="icon" type="image/png" href="assets/favicon-32.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .nf-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
    .nf-inner { max-width:480px; }
    .nf-inner img { width:88px; margin:0 auto 24px; }
    .nf-code { font-size:clamp(3rem,12vw,5rem); font-weight:900; line-height:1; color:var(--accent); }
    .nf-inner h1 { font-size:1.5rem; font-weight:800; margin:8px 0 12px; }
    .nf-inner p { color:var(--text-secondary); margin-bottom:24px; }
    .nf-links { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
  </style>
</head>
<body>
  <main class="nf-wrap">
    <div class="nf-inner">
      <img src="assets/valleymind-logo.png" alt="ValleyMind AI">
      <div class="nf-code">404</div>
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist or has moved.</p>
      <div class="nf-links">
        <a href="index.html" class="btn btn-primary">Back to Home</a>
        <a href="index.html#products" class="btn btn-outline">Explore Products</a>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
