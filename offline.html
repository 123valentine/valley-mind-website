<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — ValleyMind AI</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d0d1a">
  <link rel="icon" type="image/png" href="assets/favicon-32.png">
  <style>
    /* Inlined so the offline page always renders, even without the cached stylesheet. */
    :root { --bg:#0d0d1a; --accent:#00ffcc; --text:#f0f0f0; --muted:rgba(240,240,240,.6); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
      background:var(--bg); color:var(--text); min-height:100vh;
      display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
    }
    .wrap { max-width:440px; }
    img { width:96px; height:auto; margin:0 auto 24px; display:block; }
    h1 { font-size:1.6rem; font-weight:800; margin-bottom:12px; }
    p { color:var(--muted); line-height:1.6; margin-bottom:24px; }
    button {
      font:inherit; font-weight:700; cursor:pointer; border:none;
      background:var(--accent); color:#003642; padding:12px 24px; border-radius:100px;
    }
    button:focus-visible { outline:2px solid #fff; outline-offset:3px; }
  </style>
</head>
<body>
  <main class="wrap">
    <img src="assets/valleymind-logo.png" alt="ValleyMind AI">
    <h1>You're offline</h1>
    <p>We couldn't reach the network. Check your connection and try again — ValleyMind AI will be right here.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </main>
</body>
</html>
